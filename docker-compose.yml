# Clepsydra 生产部署编排，镜像由 GitHub Actions 构建并推送到 ghcr.io（见 .github/workflows/docker.yml）
# 配置文件不随镜像分发，部署目录需自备 configs/config.yaml（参考 configs/config.example.yaml）
# 数据库为外部 Postgres，通过 configs/config.yaml 的 database.dsn 指定，不在此编排内
services:
  clepsydra:
    image: ghcr.io/liasica/clepsydra:master
    container_name: clepsydra
    restart: unless-stopped
    pull_policy: always
    ports:
      # 宿主机端口与 configs/config.yaml 的 server.address 保持一致
      - "35936:35936"
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
      - ./uploads:/app/uploads
