# 前端代码检查：lint + 单元测试
# 前端构建本身发生在 Dockerfile 阶段一内部（见 docker.yml），此处仅做门槛检查
name: 前端代码检查

on:
  push:
    branches:
      - master
    paths:
      - 'dashboard/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

# 业务日期计算重度依赖 Asia/Shanghai（见 Dockerfile 与 CLAUDE.md），CI runner 默认 UTC
# 会导致时区相关单元测试失败，此处统一固定时区
env:
  TZ: Asia/Shanghai

jobs:
  lint-and-test:
    name: lint + 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: 检出代码
        uses: actions/checkout@v7.0.1

      - name: 配置 Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: 启用 corepack 并对齐 pnpm 版本
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: 单元测试
        run: pnpm run test:unit
