        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录接口返回的 JWT，其余接口需在 Authorization 头以 "Bearer <token>" 形式携带

  parameters:
    DemandID:
      name: id
      in: path
      required: true
      description: 需求 ID
      schema:
        type: integer
    BillID:
      name: id
      in: path
      required: true
      description: 账单 ID
      schema:
        type: integer
    UserID:
      name: id
      in: path
      required: true
      description: 用户 ID
      schema:
        type: integer
    ProjectID:
      name: id
      in: path
      required: true
      description: 项目 ID
      schema:
        type: integer

  responses:
    BadRequest:
      description: 参数错误或业务校验未通过
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40000
            message: 参数错误
    Unauthorized:
      description: 未登录或凭证失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40100
            message: 未登录或凭证失效
    Forbidden:
      description: 无权限操作，接口仅允许超级管理员访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40300
            message: 无权限操作
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 40400
            message: 资源不存在
    InvalidTransition:
      description: 当前状态不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 42200
            message: 当前状态不允许该操作
    ServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
          example:
            code: 50000
            message: 服务器内部错误

  schemas:
    Envelope:
      type: object
      description: 统一响应包装，业务数据在 data 字段中返回，失败时 data 省略
      required: [code, message]
      properties:
        code:
          type: integer
          description: 业务状态码，0 表示成功，非 0 见各接口错误响应说明
          example: 0
        message:
          type: string
          description: 提示信息，成功固定为 ok
          example: ok
        data:
          description: 业务数据，具体结构因接口而异

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: 登录用户名
        password:
          type: string
          description: 登录密码

    LoginData:
      type: object
      properties:
        token:
          type: string
          description: JWT 访问令牌
        user:
          type: object
          description: 精简用户信息
          properties:
            id:
              type: integer
              description: 用户 ID
            name:
              type: string
              description: 姓名
            role:
              type: string
              enum: [admin, client]
              description: 角色，admin 为超级管理员，client 为需求方

    User:
      type: object
      description: 系统用户，admin 为超级管理员，client 为需求方
      properties:
        id:
          type: integer
          description: 用户 ID
        username:
          type: string
          description: 登录用户名
        name:
          type: string
          description: 姓名
        role:
          type: string
          enum: [admin, client]
          description: 角色
        enabled:
          type: boolean
          description: 是否启用
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间

    UserCreateRequest:
      type: object
      required: [username, password, name, role]
      properties:
        username:
          type: string
          description: 登录用户名，不能为空且不能重复
        password:
          type: string
          description: 登录密码，至少 6 位
        name:
          type: string
          description: 姓名
        role:
          type: string
          enum: [admin, client]
          description: 角色，仅允许 admin 或 client

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: 姓名，缺省该字段表示不改动当前姓名
        enabled:
          type: boolean
          description: 是否启用，缺省该字段表示不改动当前启用状态

    UserResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: 新密码，至少 6 位

    SettingsMap:
      type: object
      description: 设置键值对，键包括 daily_rate（单价，单位元，正偶数）、base_fee（基础维护费，单位元）、demand_confirm_window（需求确认窗口）、bill_confirm_window（账单确认窗口）、window_unit（窗口口径，natural 或 workday）、saturday_as_workday（周六是否算工作日，true 或 false）、bill_include_statuses（账单包含的需求状态，逗号分隔）
      additionalProperties:
        type: string

    SettingsUpdateRequest:
      type: object
      required: [values]
      properties:
        values:
          $ref: '#/components/schemas/SettingsMap'

    Holiday:
      type: object
      description: 节假日与调休补班配置
      properties:
        id:
          type: integer
          description: 记录 ID
        date:
          type: string
          format: date
          description: 日期，格式 YYYY-MM-DD
        type:
          type: string
          enum: [holiday, workday]
          description: holiday 为休息日，workday 为调休补班日
        name:
          type: string
          description: 名称，如春节、国庆节

    HolidayEntry:
      type: object
      description: 节假日保存条目，无 ID，按日期匹配已有记录并覆盖更新
      required: [date, type]
      properties:
        date:
          type: string
          format: date
          description: 日期，格式必须为零填充的 YYYY-MM-DD
        type:
          type: string
          enum: [holiday, workday]
          description: holiday 为休息日，workday 为调休补班日
        name:
          type: string
          description: 名称

    HolidaySaveRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          description: 待保存的节假日条目列表，任一条目非法则全部拒绝
          items:
            $ref: '#/components/schemas/HolidayEntry'

    Demand:
      type: object
      description: 开发需求（项目），人天以半天数存储
      properties:
        id:
          type: integer
          description: 需求 ID
        title:
          type: string
          description: 需求标题
        description:
          type: string
          description: 需求描述，markdown 原文
        estimated_half_days:
          type: integer
          description: 预估人天，单位半天数，如 16 表示 8 人天
        estimate_confirmed_at:
          type: ["string", "null"]
          format: date-time
          description: 预估人天确认时间，未确认为空
        estimate_confirmed_by:
          type: ["integer", "null"]
          description: 预估人天确认人用户 ID，未确认为空
        planned_start_date:
          type: ["string", "null"]
          format: date-time
          description: 预测开工日期，未设置为空，创建更新时以 YYYY-MM-DD 字符串传入
        actual_start_date:
          type: ["string", "null"]
          format: date-time
          description: 实际开工日期，未开工为空
        actual_end_date:
          type: ["string", "null"]
          format: date-time
          description: 实际完成日期，未完成为空
        actual_half_days:
          type: ["integer", "null"]
          description: 实际人天，单位半天数，未完成为空
        status:
          type: string
          enum: [draft, pending_estimate, confirmed, in_progress, pending_acceptance, accepted]
          description: 需求状态
        accept_deadline:
          type: ["string", "null"]
          format: date-time
          description: 验收逾期自动确认截止时间
        accepted_at:
          type: ["string", "null"]
          format: date-time
          description: 验收确认时间
        accepted_by:
          type: ["integer", "null"]
          description: 验收确认人用户 ID，系统自动确认为 0
        accept_auto:
          type: boolean
          description: 是否为逾期自动确认
        accept_locked:
          type: boolean
          description: 是否为出账前锁定触发的自动确认
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间

    DemandRequest:
      type: object
      description: 更新需求请求体，仅标题与描述
      required: [title]
      properties:
        title:
          type: string
          description: 需求标题，不能为空
        description:
          type: string
          description: 需求描述，markdown 原文

    DemandCreateRequest:
      type: object
      description: 创建需求请求体；预估三字段为超级管理员专属，confirmed 或 planned_start_date 出现时 estimated_half_days 必须为正
      required: [title]
      properties:
        title:
          type: string
          description: 需求标题，不能为空
        description:
          type: string
          description: 需求描述，markdown 原文
        estimated_half_days:
          type: integer
          description: 预估人天，单位半天数（1 人天 = 2）；填写后创建即进入 pending_estimate
        planned_start_date:
          type: string
          format: date
          description: 预计开工日期，格式 YYYY-MM-DD，必须与预估人天同时填写
        confirmed:
          type: boolean
          description: 创建即确认人天，需求直达 confirmed，确认人记为创建者；仅超级管理员可用

    DemandEstimateRequest:
      type: object
      description: 提交人天确认的请求体，pending_estimate 状态下可重复提交修正预估
      required: [estimated_half_days]
      properties:
        estimated_half_days:
          type: integer
          description: 预估人天，单位半天数，必须为正
        planned_start_date:
          type: string
          format: date
          description: 预计开工日期，格式 YYYY-MM-DD，可为空，缺省时清空预计开工

    DemandStartRequest:
      type: object
      required: [actual_start_date]
      properties:
        actual_start_date:
          type: string
          format: date
          description: 实际开工日期，格式 YYYY-MM-DD，不能为空

    DemandFinishRequest:
      type: object
      required: [actual_start_date, actual_end_date, actual_half_days]
      properties:
        actual_start_date:
          type: string
          format: date
          description: 实际开工日期，格式 YYYY-MM-DD，不能为空
        actual_end_date:
          type: string
          format: date
          description: 实际完成日期，格式 YYYY-MM-DD，不能早于开工日期；允许填写未来日期
        actual_half_days:
          type: integer
          description: 实际人天，单位半天数，必须为正

    Project:
      type: object
      description: 项目，轻量标签形态，需求可多选归类
      properties:
        id:
          type: integer
          description: 项目 ID
        name:
          type: string
          description: 项目名称，唯一
        color:
          type: string
          description: antdv 预设 tag 色名（如 blue），空串表示默认色
        remark:
          type: string
          description: 备注
        demand_count:
          type: integer
          description: 关联需求数（不含已软删需求），仅项目列表接口有效
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间

    ProjectSave:
      type: object
      description: 项目创建 / 更新请求体
      required: [name]
      properties:
        name:
          type: string
          description: 项目名称，唯一
        color:
          type: string
          description: antdv 预设 tag 色名，可空
        remark:
          type: string
          description: 备注，可空

    Bill:
      type: object
      description: 账单，自动账单按账期（period）幂等生成，period 形如 2026-07；手动账单无账期
      properties:
        id:
          type: integer
          description: 账单 ID
        name:
          type: string
          description: 账单名称，自动账单为「自动生成：YYYY-MM」，手动账单为创建时填写的名称
        period:
          type: ["string", "null"]
          description: 账期，格式 YYYY-MM，手动账单为空
          example: "2026-07"
        status:
          type: string
          enum: [pending, unpaid, paid]
          description: 账单状态
        daily_rate:
          type: integer
          description: 生成时快照的单价，单位元
        base_fee:
          type: integer
          description: 生成时快照的基础维护费，单位元，手动账单为 0
        total_half_days:
          type: integer
          description: 计费需求的人天合计，单位半天数
        total_amount:
          type: integer
          description: 账单总金额，单位元，等于基础维护费加各计费行金额
        total_override:
          type: boolean
          description: 总额是否被手工指定，置位后重算只更新人天合计不再触碰总额
        confirm_deadline:
          type: ["string", "null"]
          format: date-time
          description: 需求方确认截止时间，生成时计算
        confirmed_at:
          type: ["string", "null"]
          format: date-time
          description: 确认时间，未确认为空
        confirmed_by:
          type: ["integer", "null"]
          description: 确认人用户 ID，未确认为空
        confirm_auto:
          type: boolean
          description: 是否为逾期自动确认
        paid_at:
          type: ["string", "null"]
          format: date-time
          description: 标记支付时间，未支付为空
        paid_by:
          type: ["integer", "null"]
          description: 标记支付人用户 ID，未支付为空
        created_at:
          type: string
          format: date-time
          description: 创建时间
        updated_at:
          type: string
          format: date-time
          description: 更新时间
        items:
          type: array
          description: 账单明细，仅账单详情接口返回
          items:
            $ref: '#/components/schemas/BillItem'

    BillItem:
      type: object
      description: 账单明细行，快照生成时的需求信息
      properties:
        id:
          type: integer
          description: 明细 ID
        demand_id:
          type: integer
          description: 关联的需求 ID
        demand_title:
          type: string
          description: 需求标题快照
        demand_status:
          type: string
          description: 需求状态快照
        half_days:
          type: integer
          description: 人天，计费行为实际人天，展示行为预估人天，单位半天数
        amount:
          type: integer
          description: 金额，单位元，展示行与减免行为 0
        billable:
          type: boolean
          description: true 为计费行，false 为展示行
        waived:
          type: boolean
          description: 是否已减免
        planned_start_date:
          type: ["string", "null"]
          format: date-time
          description: 需求预测开工日期快照
        note:
          type: string
          description: 备注
        created_at:
          type: string
          format: date-time
          description: 创建时间

    BillGenerateRequest:
      type: object
      required: [period]
      properties:
        period:
          type: string
          description: 账期，格式 YYYY-MM
          example: "2026-08"

    Todos:
      type: object
      description: 工作台待办汇总
      properties:
        pending_estimate_count:
          type: integer
          description: 待需求方确认预估人天的需求数量
        pending_acceptance_count:
          type: integer
          description: 待需求方确认验收的需求数量
        pending_bill_count:
          type: integer
          description: 待需求方确认的账单数量
        billing_due_date:
          type: string
          format: date
          description: 本月出账截止日
        billing_due_today:
          type: boolean
          description: 今天是否为出账截止日
        prev_bill_generated:
          type: boolean
          description: 上月账单是否已生成

    AuditLog:
      type: object
      description: 审计日志，只增不改不删，是操作依据
      properties:
        id:
          type: integer
          description: 日志 ID
        actor_id:
          type: integer
          description: 操作者用户 ID，0 表示系统自动操作
        actor_name:
          type: string
          description: 操作者姓名快照，系统操作为 system
        action:
          type: string
          description: 操作动作，如 demand.accept、bill.share
        target_type:
          type: string
          description: 目标类型，如 demand、bill
        target_id:
          type: integer
          description: 目标 ID
        detail:
          type: object
          description: 操作详情，结构因 action 而异
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          description: 记录时间

    AuditLogListData:
      type: object
      properties:
        total:
          type: integer
          description: 总条数
        rows:
          type: array
          description: 当前页日志列表
          items:
            $ref: '#/components/schemas/AuditLog'
