openapi: 3.1.0
info:
  title: Clepsydra API
  description: 人天统计与月度对账系统接口文档，覆盖需求全生命周期、月度账单与系统设置
  version: 1.0.0
servers:
  - url: /
    description: 相对当前部署地址
tags:
  - name: Auth
    description: 登录认证
  - name: Users
    description: 用户管理，仅超级管理员可访问
  - name: Demands
    description: 开发需求（项目）管理，登录即可查看，写操作仅超级管理员
  - name: Projects
    description: 项目标签管理，需求可多选项目归类，登录即可查看，写操作仅超级管理员
  - name: Bills
    description: 月度账单管理，登录即可查看与确认，其余写操作仅超级管理员
  - name: Settings
    description: 系统设置，仅超级管理员可访问
  - name: Holidays
    description: 节假日与调休补班配置，仅超级管理员可访问
  - name: AuditLogs
    description: 审计日志查询，仅超级管理员可访问
  - name: Dashboard
    description: 工作台待办汇总，登录即可查看

paths:
  # 公开接口，1 条，对应 router.go 的 root.POST("/auth/login", ...)
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: 登录并签发 JWT
      description: 校验用户名密码，成功后签发 JWT，后续接口需在 Authorization 头以 Bearer 前缀携带
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: 查询当前登录用户
      description: 按凭证返回当前用户精简信息，用户已停用或不存在时视为凭证失效，前端用于页面刷新后的会话恢复
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: 当前用户精简信息，字段与登录响应的 user 一致
                        properties:
                          id:
                            type: integer
                            description: 用户 ID
                          name:
                            type: string
                            description: 姓名
                          role:
                            type: string
                            enum: [admin, client]
                            description: 角色
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  # 以下 10 条为登录组（authed），登录即可访问，对应 router.go 的 authed.* 分组
  /api/dashboard/todos:
    get:
      tags: [Dashboard]
      operationId: dashboardTodos
      summary: 查询工作台待办汇总
      description: 汇总待预估确认、待验收确认、待出账数量，以及本月出账截止日与上月账单生成状态
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Todos'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/demands:
    get:
      tags: [Demands]
      operationId: demandsList
      summary: 查询需求列表
      description: 按状态筛选需求，status 为空返回全部，按 ID 倒序排列
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 需求状态筛选，为空表示不筛选
          schema:
            type: string
            enum: [draft, pending_estimate, confirmed, in_progress, pending_acceptance, accepted]
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Demand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Demands]
      operationId: demandsCreate
      summary: 创建需求
      description: 创建开发需求（项目），默认初始状态 draft；超级管理员可携带预估人天与预计开工（创建即进入 pending_estimate），再带 confirmed=true 直达 confirmed（确认人记为创建者）；需求方仅可提交标题与描述
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Demand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/demands/{id}:
    get:
      tags: [Demands]
      operationId: demandsGet
      summary: 查询需求详情
      description: 按 ID 查询单条需求
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DemandID'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Demand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Demands]
      operationId: demandsUpdate
      summary: 更新需求
      description: 更新需求标题与描述（markdown 原文），仅 draft 与 pending_estimate 状态允许，人天确认后锁定；登录即可操作，需求方也可修改
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DemandID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Demand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/demands/{id}/confirm-estimate:
    post:
      tags: [Demands]
      operationId: demandsConfirmEstimate
      summary: 需求方确认预估人天
      description: 需求方对预估人天进行确认，状态由 pending_estimate 流转为 confirmed，登录即可操作
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DemandID'
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/demands/{id}/accept:
    post:
      tags: [Demands]
      operationId: demandsAccept
      summary: 需求方确认验收
      description: 需求方人工确认需求完成验收，状态由 pending_acceptance 流转为 accepted，固定 auto=false、locked=false，登录即可操作
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DemandID'
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/projects:
    get:
      tags: [Projects]
      operationId: projectsList
      summary: 查询项目列表
      description: 全部项目及各自关联需求数（不含已软删需求），登录即可访问，供管理页、下拉与筛选使用
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Projects]
      operationId: projectsCreate
      summary: 创建项目
      description: 创建项目标签，名称必填且唯一（仅超级管理员）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSave'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/projects/{id}:
    put:
      tags: [Projects]
      operationId: projectsUpdate
      summary: 更新项目
      description: 全量更新名称、颜色与备注，名称必填且唯一（仅超级管理员）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectSave'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Projects]
      operationId: projectsDelete
      summary: 删除项目
      description: 物理删除并自动解除与需求的关联，需求本身不受影响（仅超级管理员）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/bills:
    get:
      tags: [Bills]
      operationId: billsList
      summary: 查询账单列表
      description: 查询全部月度账单，按账期倒序排列，登录即可访问
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Bill'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/bills/{id}:
    get:
      tags: [Bills]
      operationId: billsGet
      summary: 查询账单详情
      description: 按 ID 查询账单及其明细行，登录即可访问
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BillID'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Bill'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Bills]
      operationId: billsUpdate
      summary: 编辑账单
      description: 编辑账单头字段，缺省字段不修改；单价变更按新单价重算全部计费未减免明细金额；指定 total_amount 直接覆盖总额并锁定，reset_total 恢复公式计算；已支付账单拒绝，修改不重置确认状态（仅超级管理员）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BillID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 账单名称，非空
                daily_rate:
                  type: integer
                  description: 人天单价，单位元，必须为正偶数
                base_fee:
                  type: integer
                  description: 基础维护费，单位元，非负整数
                confirm_deadline:
                  type: string
                  format: date-time
                  description: 需求方确认截止时间，RFC3339 格式
                total_amount:
                  type: integer
                  description: 直接覆盖账单总额并锁定（total_override 置位），单位元，非负，与 reset_total 互斥
                reset_total:
                  type: boolean
                  description: 清除总额手工锁定并按公式重算
      responses:
        '200':
          description: 编辑成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/bills/{id}/confirm:
    post:
      tags: [Bills]
      operationId: billsConfirm
      summary: 需求方确认账单
      description: 需求方人工确认账单，确认后直接进入待支付（unpaid），固定 auto=false，登录即可操作
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BillID'
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidTransition'
        '500':
          $ref: '#/components/responses/ServerError'

  # 以下 19 条为 admin 分组，仅超级管理员，对应 router.go 的 adminGroup.* 分组
  /api/users:
    get:
      tags: [Users]
      operationId: usersList
      summary: 查询用户列表
      description: 查询全部系统用户，按 ID 升序排列（仅超级管理员）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Users]
      operationId: usersCreate
      summary: 创建用户
      description: 创建系统用户，角色仅允许 admin 或 client（仅超级管理员）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/{id}:
    put:
      tags: [Users]
      operationId: usersUpdate
      summary: 更新用户
      description: 更新用户姓名与启用状态（仅超级管理员）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/users/{id}/password:
    put:
      tags: [Users]
      operationId: usersResetPassword
      summary: 重置用户密码
      description: 重置指定用户的登录密码，至少 6 位（仅超级管理员）
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserResetPasswordRequest'
      responses:
        '200':
          description: 重置成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/settings:
    get:
      tags: [Settings]
      operationId: settingsAll
      summary: 查询全部设置
      description: 读取全部键值设置，包括单价、基础维护费、确认窗口等（仅超级管理员）
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SettingsMap'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Settings]
      operationId: settingsUpdate
      summary: 批量更新设置
      description: 批量更新键值设置，全部校验通过后逐项写入（仅超级管理员）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/holidays:
    get:
      tags: [Holidays]
      operationId: holidaysList
      summary: 查询节假日列表
